<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC] font-['Inter'] p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold text-[#1E3A8A] mb-8">Job Application Tracker</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                <p class="text-slate-500 font-medium mb-2">Total</p>
                <h2 id="total-count" class="text-4xl font-bold text-[#1E3A8A]">0</h2>
            </div>
            <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                <p class="text-slate-500 font-medium mb-2 text-green-600">Interview</p>
                <h2 id="interview-count" class="text-4xl font-bold text-green-600">0</h2>
            </div>
            <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                <p class="text-slate-500 font-medium mb-2 text-red-500">Rejected</p>
                <h2 id="rejected-count" class="text-4xl font-bold text-red-500">0</h2>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col min-h-[600px]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white">
                <h3 class="text-lg font-bold text-[#1E3A8A]">Available Jobs</h3>
                <span id="tab-job-count" class="text-slate-400 text-sm font-medium">0 jobs</span>
            </div>

            <div class="px-6 py-4 flex gap-2 border-b border-slate-50 bg-slate-50/30">
                <button onclick="filterJobs('All')" class="tab-btn active px-6 py-1.5 rounded text-xs font-bold transition-all">All</button>
                <button onclick="filterJobs('Interview')" class="tab-btn px-6 py-1.5 rounded text-xs font-bold transition-all">Interview</button>
                <button onclick="filterJobs('Rejected')" class="tab-btn px-6 py-1.5 rounded text-xs font-bold transition-all">Rejected</button>
            </div>

            <div id="jobs-container" class="flex-grow divide-y divide-slate-100 overflow-y-auto">
                </div>

            <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
                <button onclick="filterJobs('All')" class="tab-btn active px-6 py-1.5 rounded text-xs font-bold transition-all">All</button>
                <button onclick="filterJobs('Interview')" class="tab-btn px-6 py-1.5 rounded text-xs font-bold transition-all">Interview</button>
                <button onclick="filterJobs('Rejected')" class="tab-btn px-6 py-1.5 rounded text-xs font-bold transition-all">Rejected</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
